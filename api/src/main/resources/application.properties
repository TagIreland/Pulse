spring.application.name=pulse-api
server.port=8080

# --- Day 1 -------------------------------------------------------------------
# There is no database yet, so Spring's JDBC auto-configuration is switched off.
# Without this line the application refuses to start with "Failed to configure a
# DataSource", because the Postgres driver is on the classpath but there is no URL.
#
# Note the package: Spring Boot 4 moved auto-configuration classes out of the single
# org.springframework.boot.autoconfigure.* tree into one package per module. A stale
# name here is not an error — the exclude is ignored silently and you get the
# "Failed to determine a suitable driver class" startup failure instead.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

