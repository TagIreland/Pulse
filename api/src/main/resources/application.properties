spring.application.name=pulse-api
server.port=8080

# --- Day 1 -------------------------------------------------------------------
# There is no database yet, so Spring's JDBC auto-configuration is switched off.
# Without this line the application refuses to start with "Failed to configure a
# DataSource", because the Postgres driver is on the classpath but there is no URL.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# --- Day 2 -------------------------------------------------------------------
# Delete the line above, uncomment these three, and get the values from the data
# team. Set them as environment variables in your shell (or as run configuration
# variables in IntelliJ). Do not paste the real values into this file: it is
# committed, and a Supabase password in GitHub is found by strangers within minutes.
#
# spring.datasource.url=${DB_URL}
# spring.datasource.username=${DB_USER}
# spring.datasource.password=${DB_PASSWORD}
